<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BiS Saucer</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="layout">
      <header class="topbar">
        <img
          id="mascotte"
          class="mascotte"
          src="img/bolderiz.png"
          alt=""
          title="Bolderiz — mascotte de la guilde"
          hidden
        />
        <img class="ewe" src="img/ewe.png" alt="" title="Ewe" />
        <div class="brand-zone">
          <!-- Le blason ouvre la barre : c'est la porte d'entree de l'outil, et il
               doit se voir avant les antiseches. Rempli par app.js, qui sait s'il
               faut l'allumer. -->
          <div id="guild-slot" class="guild-slot"></div>
          <!-- Antiseche des recompenses Mythique+ : une table de reference qu'on
               deroule d'un clic et qu'on referme aussitot, sans quitter la vue en
               cours. Le panneau est rempli par app.js. -->
          <button
            id="cle-toggle"
            class="cle-toggle"
            type="button"
            aria-expanded="false"
            aria-controls="cle-panneau"
            title="Récompenses par niveau de clé mythique"
          >
            <img
              src="https://wow.zamimg.com/images/wow/icons/medium/inv_relics_hourglass.jpg"
              alt="Récompenses par niveau de clé"
            />
          </button>
          <!-- Classement Power Infusion, meme mecanique de panneau deroulant. -->
          <button
            id="pi-toggle"
            class="cle-toggle"
            type="button"
            aria-expanded="false"
            aria-controls="pi-panneau"
            title="Qui profite le plus de la Power Infusion du prêtre"
          >
            <img
              src="https://wow.zamimg.com/images/wow/icons/medium/spell_holy_powerinfusion.jpg"
              alt="Classement Power Infusion"
            />
          </button>
          <div
            id="pi-panneau"
            class="cle-panneau cle-panneau--pi"
            role="dialog"
            aria-label="Classement Power Infusion"
          ></div>
          <div
            id="cle-panneau"
            class="cle-panneau"
            role="dialog"
            aria-label="Récompenses par niveau de clé mythique"
          ></div>
        </div>
        <div id="selector-bar" class="selector-bar"></div>
        <div class="topbar-end">
          <div class="lang-switch" id="lang-switch">
            <button type="button" data-lang="fr">FR</button>
            <button type="button" data-lang="en">EN</button>
          </div>
          <img class="footzy footzy--right" src="img/footzy.png" alt="" title="Footzy" />
        </div>
      </header>

      <main class="panel">
        <header class="panel-head">
          <div class="panel-title">
            <div id="spec-avatar" class="avatar"></div>
            <div>
              <h2 id="spec-name">—</h2>
              <p id="spec-sub" class="panel-sub"></p>
            </div>
          </div>
          <!-- Un seul bouton, trois sources : le libellé ne peut en nommer aucune. -->
          <button
            id="refresh-btn"
            type="button"
            class="refresh"
            title="Récupère la liste BiS (Icy Veins), la tier list et les consommables (Wowhead), et le classement simulé (Bloodmallet)"
          >
            Mettre à jour
          </button>
          <!-- Fraîcheur des données, sur la version publiée seulement : là-bas
               personne ne peut mettre à jour, savoir de quand ça date est la seule
               chose qui compte. Occupe la place du bouton, qui y est masqué. -->
          <span id="maj-donnees" class="maj" hidden></span>
        </header>

        <!-- Uniquement les vues de la spec affichée : ce qui concerne tout le roster
             (/rand de guilde, Roster) vit dans les carrés de la barre du haut. Le
             « /rand » ci-dessous est celui de la spec, limité à ses objets. -->
        <nav class="tabs">
          <button class="tab is-active" data-view="list" type="button">Liste BiS</button>
          <button class="tab" data-view="mplus" type="button">M+ opti</button>
          <button class="tab" data-view="conso" type="button">Consommables</button>
          <button class="tab" data-view="rand" type="button">/rand</button>
        </nav>

        <div id="list-picker" class="list-picker" hidden></div>
        <div id="message" class="message" hidden></div>

        <section id="content" class="content"></section>

        <footer class="legend">
          <span id="store-status"></span>
          <span id="legend-meta" class="legend-meta"></span>
        </footer>
      </main>
    </div>

    <!-- Tooltips officiels Wowhead (embed supporté et prévu pour cet usage).
         En français, `renameLinks` laisse Wowhead réécrire le texte des liens avec le
         nom localisé de l'objet : c'est le mécanisme officiel, aucun scrape en plus.
         La configuration est lue au chargement, d'où le rechargement au changement. -->
    <script>
      window.BIS_LANG = localStorage.getItem('bis-lang') === 'en' ? 'en' : 'fr';
      // renameLinks est actif dans les deux langues : en français il localise les noms,
      // et dans les deux cas il nomme les pièces d'origine à catalyser, dont on ne
      // connaît que l'identifiant.
      const whTooltips = { colorLinks: true, iconizeLinks: false, renameLinks: true };
    </script>
    <script src="https://wow.zamimg.com/widgets/power.js"></script>
    <script src="app.js"></script>
  </body>
</html>
